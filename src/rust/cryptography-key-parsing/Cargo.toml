[package]
name = "cryptography-key-parsing"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
asn1.workspace = true
cfg-if.workspace = true
cryptography-crypto = { path = "../cryptography-crypto", default-features = false }
cryptography-openssl = { path = "../cryptography-openssl", optional = true }
cryptography-x509 = { path = "../cryptography-x509" }
getrandom = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
openssl-sys = { workspace = true, optional = true }
pem.workspace = true
verified-garbage = { workspace = true, optional = true }

[features]
default = ["openssl"]
openssl = [
    "dep:openssl",
    "dep:openssl-sys",
    "dep:cryptography-openssl",
    "cryptography-crypto/openssl",
]
verified-garbage = [
    "dep:verified-garbage",
    "dep:getrandom",
    "cryptography-crypto/verified-garbage",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(CRYPTOGRAPHY_IS_LIBRESSL)', 'cfg(CRYPTOGRAPHY_IS_BORINGSSL)', 'cfg(CRYPTOGRAPHY_OPENSSL_350_OR_GREATER)', 'cfg(CRYPTOGRAPHY_OSSLCONF, values("OPENSSL_NO_RC2", "OPENSSL_NO_RC4"))', 'cfg(CRYPTOGRAPHY_IS_AWSLC)'] }
