[package]
name = "cryptography-rust"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
asn1.workspace = true
base64.workspace = true
cfg-if.workspace = true
cryptography-cffi = { path = "cryptography-cffi", optional = true }
cryptography-crypto = { path = "cryptography-crypto", default-features = false }
cryptography-keepalive = { path = "cryptography-keepalive" }
cryptography-key-parsing = { path = "cryptography-key-parsing", default-features = false }
cryptography-openssl = { path = "cryptography-openssl", optional = true }
cryptography-x509 = { path = "cryptography-x509" }
cryptography-x509-verification = { path = "cryptography-x509-verification" }
foreign-types-shared.workspace = true
getrandom = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
openssl-sys = { workspace = true, optional = true }
pem.workspace = true
pyo3.workspace = true
self_cell.workspace = true
verified-garbage = { workspace = true, optional = true }

[features]
# Exactly one crypto backend must be enabled. OpenSSL (or LibreSSL,
# BoringSSL, AWS-LC) is the default; build with
# `--no-default-features --features verified-garbage` to use
# verified-garbage instead, without linking OpenSSL at all.
default = ["openssl"]
openssl = [
    "dep:openssl",
    "dep:openssl-sys",
    "dep:cryptography-openssl",
    "dep:cryptography-cffi",
    "cryptography-crypto/openssl",
    "cryptography-key-parsing/openssl",
]
verified-garbage = [
    "dep:verified-garbage",
    "dep:getrandom",
    "cryptography-crypto/verified-garbage",
    "cryptography-key-parsing/verified-garbage",
]

[build-dependencies]
pyo3-build-config.workspace = true

[lib]
name = "cryptography_rust"
crate-type = ["cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(CRYPTOGRAPHY_OPENSSL_309_OR_GREATER)', 'cfg(CRYPTOGRAPHY_OPENSSL_320_OR_GREATER)', 'cfg(CRYPTOGRAPHY_OPENSSL_330_OR_GREATER)', 'cfg(CRYPTOGRAPHY_OPENSSL_350_OR_GREATER)', 'cfg(CRYPTOGRAPHY_IS_LIBRESSL)', 'cfg(CRYPTOGRAPHY_IS_BORINGSSL)', 'cfg(CRYPTOGRAPHY_IS_AWSLC)', 'cfg(CRYPTOGRAPHY_BUILD_OPENSSL_NO_LEGACY)', 'cfg(CRYPTOGRAPHY_OSSLCONF, values("OPENSSL_NO_IDEA", "OPENSSL_NO_CAST", "OPENSSL_NO_BF", "OPENSSL_NO_CAMELLIA", "OPENSSL_NO_SEED", "OPENSSL_NO_SM4", "OPENSSL_NO_RC4"))'] }
