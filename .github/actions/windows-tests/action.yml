name: Windows tests
description: |
  Runs the cryptography test suite on Windows. Used by ci.yml for both
  x64 and arm64 jobs to avoid duplication.

inputs:
  python-version:
    description: "Python version to test (e.g. 3.9, 3.14, 3.14t)"
    required: true
  noxsession:
    description: "Nox session to run (e.g. tests, tests-nocoverage)"
    required: true
  arch:
    description: "actions/setup-python architecture (x86, x64, arm64)"
    required: true
  openssl-name:
    description: "OpenSSL artifact name suffix (win32, win64, arm64)"
    required: true

runs:
  using: "composite"

  steps:
    # uv has no Windows arm64 interpreters, so that job uses setup-python.
    - name: Setup python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version-file: ci-constraints-requirements.txt
        python-version: ${{ inputs.python-version }}
        activate-environment: true
        cache-dependency-glob: ci-constraints-requirements.txt
      if: inputs.arch != 'arm64'
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
        architecture: ${{ inputs.arch }}
        cache: pip
        cache-dependency-path: ci-constraints-requirements.txt
      if: inputs.arch == 'arm64'
    - id: python-version
      run: echo "version=$(python -c 'import platform; print(platform.python_version())')" >> $GITHUB_OUTPUT
      shell: bash
    # llvm-tools is only used to process Rust coverage data, which the
    # tests-nocoverage session doesn't collect.
    - run: rustup component add llvm-tools-preview
      shell: bash
      if: ${{ inputs.noxsession != 'tests-nocoverage' }}
    # Before the cache step: the artifact id is part of its key.
    - name: Download OpenSSL
      id: openssl
      uses: ./.github/actions/fetch-openssl
      with:
        workflow: build-windows-openssl.yml
        name: "openssl-${{ inputs.openssl-name }}"
        path: "C:/openssl-${{ inputs.openssl-name }}/"
    - name: Configure
      run: |
          echo "OPENSSL_DIR=C:/openssl-${OPENSSL_NAME}" >> $GITHUB_ENV
      env:
        OPENSSL_NAME: ${{ inputs.openssl-name }}
      shell: bash
    - name: Cache rust and pip
      uses: ./.github/actions/cache
      with:
        key: ${{ inputs.noxsession }}-${{ inputs.arch }}-${{ steps.python-version.outputs.version }}-${{ steps.openssl.outputs.artifact-id }}
    - run: uv pip install -c ci-constraints-requirements.txt "nox[uv]" "tomli; python_version < '3.11'"
      shell: bash
      if: inputs.arch != 'arm64'
    - run: python -m pip install -c ci-constraints-requirements.txt "nox[uv]" "tomli; python_version < '3.11'"
      shell: bash
      if: inputs.arch == 'arm64'

    - name: Clone test vectors
      uses: ./.github/actions/fetch-vectors

    - name: Build nox environment
      run: nox -v --install-only
      env:
        NOXSESSION: ${{ inputs.noxsession }}
      shell: bash
    - name: Tests
      run: nox --no-install --  --color=yes --wycheproof-root=wycheproof --x509-limbo-root=x509-limbo
      env:
        NOXSESSION: ${{ inputs.noxsession }}
        COLUMNS: 80
      shell: bash
